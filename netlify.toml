[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Robots-Tag = "noindex, nofollow"

# Sous-domaine revendeurs : sauvegarde.marketimehub.fr sert le simulateur sauvegarde
[[redirects]]
  from = "https://sauvegarde.marketimehub.fr/*"
  to = "/sauvegarde/:splat"
  status = 200
  force = true
